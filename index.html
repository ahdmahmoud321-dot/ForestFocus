<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">تركيز الغابة | تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #username {
            margin-bottom: 15px !important;
        }
        .input-group-custom {
            position: relative;
            width: 100%;
            margin-bottom: 20px !important;
        }
        .input-group-custom input {
            width: 100%;
            margin-bottom: 0 !important;
            padding-left: 45px !important;
        }
        .toggle-eye {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            z-index: 10;
            opacity: 0.6;
            user-select: none;
        }
        .toggle-eye:hover {
            opacity: 1;
        }
        .top-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="top-buttons">
        <button id="themeToggle" class="action-icon-btn">🌙 الداكن</button>
        <button id="langToggle" class="action-icon-btn">🌐 AR | EN</button>
    </div>

    <div style="font-size: 50px; margin-bottom: 5px;">🌳</div>
    <h1 id="mainTitle">تركيز الغابة</h1>
    <p class="tagline" id="subTitle">مرحبًا بك مجددًا 👋</p>

    <input type="text" id="username" placeholder="اسم المستخدم">

    <div class="input-group-custom">
        <input type="password" id="password" placeholder="كلمة المرور">
        <span id="togglePassword" class="toggle-eye">👁️</span>
    </div>

    <button id="loginBtn">تسجيل الدخول</button>

    <p style="margin-top: 15px;">
        <span id="noAccountText">ليس لديك حساب؟</span>
        <a href="signup.html" id="signupLink">إنشاء حساب جديد</a>
    </p>

    <p class="footer-credit" id="footerText">© 2026 تم التطوير بواسطة عهد</p>
</div>

<script>
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const usernameInput = document.getElementById('username');
    const langToggleBtn = document.getElementById('langToggle');

    // إخفاء/إظهار كلمة المرور
    togglePasswordBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            togglePasswordBtn.innerText = '🙈';
        } else {
            passwordInput.type = 'password';
            togglePasswordBtn.innerText = '👁️';
        }
    });

    // ترجمة النصوص
    const translations = {
        ar: {
            title: "تركيز الغابة | تسجيل الدخول",
            mainTitle: "تركيز الغابة",
            subTitle: "مرحبًا بك مجددًا 👋",
            userInput: "اسم المستخدم",
            passInput: "كلمة المرور",
            loginBtn: "تسجيل الدخول",
            noAccount: "ليس لديك حساب؟",
            signupLink: "إنشاء حساب جديد",
            footer: "© 2026 تم التطوير بواسطة عهد",
            invalidErr: "اسم المستخدم أو كلمة المرور غير صحيحة!"
        },
        en: {
            title: "Forest Focus | Login",
            mainTitle: "Forest Focus",
            subTitle: "Welcome Back 👋",
            userInput: "Username",
            passInput: "Password",
            loginBtn: "Login",
            noAccount: "Don't have an account?",
            signupLink: "Create Account",
            footer: "© 2026 Developed by Ahd",
            invalidErr: "Invalid Username or Password!"
        }
    };

    let currentLang = localStorage.getItem('appLang') || 'ar';

    function applyLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);

        const t = translations[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        document.getElementById('pageTitle').innerText = t.title;
        document.getElementById('mainTitle').innerText = t.mainTitle;
        document.getElementById('subTitle').innerText = t.subTitle;
        usernameInput.placeholder = t.userInput;
        passwordInput.placeholder = t.passInput;
        document.getElementById('loginBtn').innerText = t.loginBtn;
        document.getElementById('noAccountText').innerText = t.noAccount;
        document.getElementById('signupLink').innerText = t.signupLink;
        document.getElementById('footerText').innerText = t.footer;

        // تعديل مكان العين بناءً على الاتجاه
        togglePasswordBtn.style.left = lang === 'ar' ? '15px' : 'auto';
        togglePasswordBtn.style.right = lang === 'en' ? '15px' : 'auto';
        passwordInput.style.paddingLeft = lang === 'ar' ? '45px' : '12px';
        passwordInput.style.paddingRight = lang === 'en' ? '45px' : '12px';
    }

    langToggleBtn.addEventListener('click', () => {
        let newLang = currentLang === 'ar' ? 'en' : 'ar';
        applyLanguage(newLang);
    });

    // تسجيل الدخول
    document.getElementById('loginBtn').addEventListener('click', () => {
        const u = usernameInput.value.trim();
        const p = passwordInput.value.trim();
        
        let accounts = JSON.parse(localStorage.getItem('userAccounts')) || {"Guest": "1234"};
        
        if(accounts[u] && accounts[u] === p) {
            localStorage.setItem('currentUser', u);
            window.location.href = 'dashboard.html';
        } else {
            alert(translations[currentLang].invalidErr);
        }
    });

    // المظهر الداكن/الفاتح
    const themeBtn = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-theme');
        themeBtn.innerText = "☀️ الضوء";
    }

    themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-theme');
        const isDark = document.body.classList.contains('dark-theme');
        themeBtn.innerText = isDark ? "☀️ الضوء" : "🌙 الداكن";
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // تطبيق اللغة أول ما الصفحة تفتح
    applyLanguage(currentLang);
</script>
</body>
</html>
