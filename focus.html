<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">تركيز الغابة - جلسة التركيز</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="focus.css">
    <style>
        body.dark-theme { background-color: #0F172A; color: #F8FAFC; }
        .navbar {
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            display: flex; gap: 20px; padding: 15px; justify-content: center; align-items: center;
        }
        .navbar a { color: #94A3B8; text-decoration: none; font-weight: 600; font-size: 14px; }
        .navbar a.active { color: #00d2ff !important; text-shadow: 0 0 10px rgba(0,210,255,0.6); }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: #00d2ff;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .lang-btn:hover {
            background: rgba(0, 210, 255, 0.1);
        }

        .glass-container {
            background: #1E293B; border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 30px; border-radius: 24px; width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 10px 30px rgba(0, 210, 255, 0.1); margin: 40px auto;
        }
        .timer-btn {
            background: #00d2ff; color: #0F172A; border: none; padding: 12px 24px;
            font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; margin: 5px;
        }
        .timer-btn:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(0,210,255,0.5); }
        .progress-bar-bg { background: #334155; height: 12px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { background: #22C55E; height: 100%; width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px #22C55E; }
    </style>
</head>
<body class="dark-theme">

    <div class="navbar">
        <a href="dashboard.html" id="navDashboard">📋 لوحة التحكم</a>
        <a href="focus.html" class="active" id="navFocus">🎯 وضع التركيز</a>
        <button id="langToggle" class="lang-btn">🌐 AR | EN</button>
    </div>

    <div class="glass-container">
        <h2 id="sessionTitle">🎯 جلسة التركيز</h2>
        <p class="subtitle" id="sessionSubtitle">حافظ على تركيزك لمدة 30 دقيقة لزيادة إحصائياتك</p>

        <div class="circle-timer-wrap">
            <svg class="timer-svg" viewBox="0 0 100 100">
                <circle class="bg-circle" cx="50" cy="50" r="45"></circle>
                <circle id="progressCircle" stroke="#00d2ff" stroke-width="6" fill="transparent" r="45" cx="50" cy="50" stroke-dasharray="283" stroke-dashoffset="0"></circle>
            </svg>
            <div id="timerDisplay">30:00</div>
        </div>

        <div class="control-panel">
            <button id="startBtn" class="timer-btn">ابدأ</button>
            <button id="pauseBtn" class="timer-btn" style="background:#64748B; color:white;">مؤقت</button>
            <button id="resetBtn" class="timer-btn" style="background:#EF4444; color:white;">إعادة</button>
        </div>

        <div class="daily-goals-card" style="margin-top: 30px; text-align: right; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 14px; border: 1px solid #334155;">
            <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: bold;">
                <span id="sessionsCountLabel">إجمالي التركيز اليوم: 0 دقيقة</span>
                <span id="goalPercentText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="goalBarFill" class="progress-bar-fill"></div>
            </div>
            <p id="footerHint" style="font-size: 11px; color: #94A3B8; margin-top: 8px; text-align: center;">كل 30 دقيقة تدفع شريط إنجازك إلى الأمام!</p>
        </div>
    </div>

    <script>
    const currentUser = localStorage.getItem('currentUser') || 'Guest';
    function getUserKey(name) { return currentUser + "_" + name; }

    let defaultTime = 30 * 60; // 30 دقيقة
    let timeLeft = defaultTime;
    let timer = null;
    let isRunning = false;

    // عناصر الصفحة
    const timerDisplay = document.getElementById('timerDisplay');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const progressCircle = document.getElementById('progressCircle');
    const langToggle = document.getElementById('langToggle');

    // لغة التطبيق
    let currentLang = localStorage.getItem('appLang') || 'ar';

    const translations = {
        ar: {
            title: "تركيز الغابة - جلسة التركيز",
            navDashboard: "📋 لوحة التحكم",
            navFocus: "🎯 وضع التركيز",
            sessionTitle: "🎯 جلسة التركيز",
            sessionSubtitle: "حافظ على تركيزك لمدة 30 دقيقة لزيادة إحصائياتك",
            startBtn: "ابدأ",
            pauseBtn: "مؤقت",
            resetBtn: "إعادة",
            focusedToday: "إجمالي التركيز اليوم:",
            mins: "دقيقة",
            footerHint: "كل 30 دقيقة تدفع شريط إنجازك إلى الأمام!",
            alertSuccess: "🎉 أحسنتِ! انتهت الجلسة بنجاح وحصلتِ على 5 نقاط وزادت غابتك نمواً! 🌳",
            cardAlign: "right"
        },
        en: {
            title: "Forest Focus - Focus Session",
            navDashboard: "📋 Dashboard",
            navFocus: "🎯 Focus Mode",
            sessionTitle: "🎯 Focus Session",
            sessionSubtitle: "Stay focused for 30 minutes to grow your stats",
            startBtn: "Start",
            pauseBtn: "Pause",
            resetBtn: "Reset",
            focusedToday: "Total Focused Today:",
            mins: "mins",
            footerHint: "Every 30 minutes pushes your progress bar forward!",
            alertSuccess: "🎉 Excellent! Session completed successfully! You earned +5 points! 🌳",
            cardAlign: "left"
        }
    };

    function applyLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);

        const t = translations[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        document.getElementById('pageTitle').innerText = t.title;
        document.getElementById('navDashboard').innerText = t.navDashboard;
        document.getElementById('navFocus').innerText = t.navFocus;
        document.getElementById('sessionTitle').innerText = t.sessionTitle;
        document.getElementById('sessionSubtitle').innerText = t.sessionSubtitle;
        startBtn.innerText = t.startBtn;
        pauseBtn.innerText = t.pauseBtn;
        resetBtn.innerText = t.resetBtn;
        document.getElementById('footerHint').innerText = t.footerHint;

        const card = document.querySelector('.daily-goals-card');
        if (card) card.style.textAlign = t.cardAlign;

        loadStats();
    }

    langToggle.addEventListener('click', () => {
        let newLang = currentLang === 'ar' ? 'en' : 'ar';
        applyLanguage(newLang);
    });

    function updateDisplay() {
        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        let pct = (timeLeft / defaultTime) * 283;
        progressCircle.style.strokeDashoffset = 283 - pct;
    }

    function loadStats() {
        let totalMins = parseInt(localStorage.getItem(getUserKey('totalMinutes')) || '0');
        let goalMinutes = 150; 
        let pct = Math.min(100, Math.round((totalMins / goalMinutes) * 100));
        const t = translations[currentLang];
        
        document.getElementById('goalPercentText').innerText = `${pct}%`;
        document.getElementById('goalBarFill').style.width = `${pct}%`;
        document.getElementById('sessionsCountLabel').innerText = `${t.focusedToday} ${totalMins} ${t.mins}`;
    }

    startBtn.addEventListener('click', () => {
        if (isRunning) return; isRunning = true;
        timer = setInterval(() => {
            if (timeLeft > 0) { 
                timeLeft--; 
                updateDisplay(); 
            } 
            else {
                clearInterval(timer); 
                isRunning = false;
                
                let currentPoints = parseInt(localStorage.getItem(getUserKey('points')) || '0');
                let currentMins = parseInt(localStorage.getItem(getUserKey('totalMinutes')) || '0');
                
                localStorage.setItem(getUserKey('points'), currentPoints + 5);
                localStorage.setItem(getUserKey('totalMinutes'), currentMins + 30);
                
                alert(translations[currentLang].alertSuccess);
                
                timeLeft = defaultTime; 
                updateDisplay(); 
                loadStats();
            }
        }, 1000);
    });

    pauseBtn.addEventListener('click', () => { clearInterval(timer); isRunning = false; });
    resetBtn.addEventListener('click', () => { clearInterval(timer); isRunning = false; timeLeft = defaultTime; updateDisplay(); });

    // تشغيل اللغة الأولية وإلإحصائيات
    applyLanguage(currentLang);
    updateDisplay(); 
</script>

</body>
</html>
